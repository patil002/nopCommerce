name: nopcommerceworkflow
on:
  push:
    branches:
      - develop

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: 123456789012          # 🔹 Replace with your AWS Account ID
      ECR_REPOSITORY: nopcommerce-app
      DOTNET_OUTPUT_DIR: demo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish .NET app
        run: dotnet publish -c Release src/Presentation/Nop.Web/Nop.Web.csproj -o ${{ env.DOTNET_OUTPUT_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image to ECR
        run: |
          IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest
          echo "Building image: $IMAGE_URI"
          docker build -t $IMAGE_URI -f src/Presentation/Nop.Web/Dockerfile .
          docker push $IMAGE_URI
